[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "larryd"
version = "0.1.0"
description = "LARRYD, the daemon: build, test and submit agents for LARRYD with Claude Code."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
larryd = "larryd.cli:main"

[tool.setuptools]
packages = ["larryd"]

[tool.setuptools.package-data]
larryd = ["kit/*", "kit/**/*", "skills.json"]
