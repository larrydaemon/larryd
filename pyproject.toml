[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "larryd"
version = "0.1.1"
description = "Your server has a daemon. Your agents should have one too. Build, test and ship AI agents with Claude Code."
readme = "README.md"
keywords = ["ai-agents", "claude-code", "mcp", "cli", "sandbox"]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["flask>=3"]   # the daemon (LARRYD's runtime) serves over Flask; the tool itself is the standard library only

[project.optional-dependencies]
door = ["cryptography>=42"]   # the submit door on the larryd machine only (it checks the SSO proxy's signed hand-off)

[project.urls]
Homepage = "https://larryd.ai"
Repository = "https://github.com/larrydaemon/larryd"
Documentation = "https://github.com/larrydaemon/larryd/blob/main/GUIDE.md"

[project.scripts]
larryd = "larryd.cli:main"

[tool.setuptools]
# the tool (larryd/) and the daemon's code (the runtime, server/hanzo/app, as larryd_runtime); never an instance, a secret or a test
packages = ["larryd", "larryd_runtime", "larryd_runtime.core_engine", "larryd_runtime.web"]

[tool.setuptools.package-dir]
larryd = "larryd"
larryd_runtime = "server/hanzo/app"

[tool.setuptools.package-data]
larryd = ["kit/*", "kit/**/*", "skills.json", "submit_door.json"]
larryd_runtime = ["schemas/*.json", "agents/marketplace/agent.json", "agents/marketplace/agent.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]   # the tool's tests; the runtime (server/) runs its own suite with its own venv
