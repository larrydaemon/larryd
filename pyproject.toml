[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "larryd"
version = "0.1.0"
description = "Your server has a daemon. Your agents should have one too."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
larryd = "larryd.cli:main"

[tool.setuptools]
packages = ["larryd"]

[tool.setuptools.package-data]
larryd = ["kit/*", "kit/**/*", "skills.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]   # the tool's tests; the runtime (server/) runs its own suite with its own venv
