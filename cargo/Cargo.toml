[package]
name = "larryd"
version = "0.1.0"
edition = "2021"
description = "Your server has a daemon. Your agents should have one too. Build, test and ship AI agents with Claude Code."
homepage = "https://larryd.ai"
repository = "https://github.com/larrydaemon/larryd"
license = "Apache-2.0"
readme = "README.md"
keywords = ["ai-agents", "claude-code", "mcp", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "larryd"
path = "src/main.rs"
